name: AMVO verification gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Tests, policy and static build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python
        run: python -m compileall -q amvo tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate public records
        run: python -m amvo validate
      - name: Public data screening
        run: python -m amvo audit-public
      - name: Produce deterministic verification report
        run: python -m amvo verify --output build/verification.json
      - name: Build static website
        run: python -m amvo build-site --output site
      - name: Attach website bundle
        uses: actions/upload-artifact@v4
        with:
          name: amvo-static-site
          path: site/
          if-no-files-found: error
