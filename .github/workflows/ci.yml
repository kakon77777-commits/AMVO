name: AMVO verification gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Gates (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: B01 compile Python
        run: python -m compileall -q amvo tests
      - name: B02 unit tests
        run: python -m unittest discover -s tests -v
      - name: B03 validate public records
        run: python -m amvo validate
      - name: B04 public data screening
        run: python -m amvo audit-public
      - name: B05 deterministic verification report
        run: python -m amvo verify --output build/verification.json
      - name: B06 build static website
        run: python -m amvo build-site --output site
      - name: B07 ledgers are append-only
        # events/, evidence/provenance/ and registry/ may gain files in a pull request, never lose or change one
        # a pull_request run checks out the merge commit; its first parent is the base it merges into
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          changed="$(git diff --name-status --no-renames --diff-filter=DMT HEAD^1 HEAD -- events evidence/provenance registry ':(exclude,glob)**/README.md')"
          echo "$changed"
          test -z "$changed"
      - name: B08 no unexpected tracked changes
        shell: bash
        run: |
          git status --porcelain --untracked-files=no
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Attach website bundle
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: amvo-static-site
          path: site/
          if-no-files-found: error
